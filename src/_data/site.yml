# Site-wide settings. Edit text here; it updates every page.
title: Selin Group
tagline: Pollution, Impacts and Policy at MIT
url: https://www.selingroup.org
description: >-
  The Selin Group at MIT uses atmospheric chemistry and integrated modeling
  to inform sustainability decision-making.

