# Home page
hero:
  heading: Pollution, Impacts and Policy
  text: >-
    We use systems modeling to understand how pollution and climate change
    affect human well-being, and to inform decisions for sustainable
    development.
  image: /assets/images/site/hero.jpg

themes:
  # credit: optional small line shown just under the image
  - title: Pollution and Impacts
    anchor: pollution-and-impacts
    image: /assets/images/site/air-pollution-impacts.jpg
    credit: "Photo: N. Selin"
    text: >-
      We study how air pollutants such as mercury, PAHs, ozone and fine
      particulate matter (PM2.5) are emitted, transported and transformed, and
      how pollution and climate change affect human health, ecosystems and
      well-being. We trace these impacts from their sources to the people and
      places affected, with attention to equity within and across generations.
  - title: Systems Modeling
    anchor: systems-modeling
    image: /assets/images/site/systems-modeling.jpg
    credit: "Image: PNAS"
    text: >-
      We build and use a range of modeling tools, ranging from detailed atmospheric
      chemistry models to fast, AI-based emulators and frameworks that connect
      interacting natural and societal systems. We develop and mobilize these tools in order to provide information about synergies and trade-offs along paths toward
      sustainable development.
  - title: Decisions and Policies
    anchor: decisions-and-policies
    image: /assets/images/site/decisions-and-policy.jpg
    credit: "Photo: N. Selin"
    text: >-
      We analyze how environmental decisions are made and their impacts at multiple levels,
      from global treaties like the Minamata Convention to national
      regulation and organizations' climate commitments. We evaluate the impacts of current and prospective policies, assessing their effects on health,
      climate and equity, to support actions that improve well-being for
      current and future generations.

