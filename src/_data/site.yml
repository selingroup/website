# Home page
hero:
  heading: Pollution, Impacts and Policy
  text: >-
    Our group research focuses on using atmospheric chemistry and integrated
    modeling to inform sustainability decision-making.
  image: /assets/images/site/hero.jpg

themes:
  - title: Mercury and POPs
    image: /assets/images/site/mercury-pops.jpg
    text: >-
      Mercury (Hg) and persistent organic pollutants (POPs) are long-lived
      environmental pollutants that travel globally through the atmosphere, and
      pose risks to humans and the environment far from emission sources. Our
      work tries to better understand the fate and transport of these contaminants.
  - title: Air Pollution Impacts
    image: /assets/images/site/air-pollution-impacts.jpg
    text: >-
      Toxic air pollutants, including Hg, POPs, ozone, and fine particulate
      matter, can be dangerous to human health. We develop tools to help
      decision-makers understand and project air pollution impacts, in the
      context of uncertainty and global change, including climate changes.
  - title: Decisions and Policy
    image: /assets/images/site/decisions-and-policy.jpg
    text: >-
      Our analyses are designed to inform policies and decisions, with the goal
      of enhancing sustainability for future generations. We are interested in
      understanding and enhancing the role of science in sustainability
      decision-making.

