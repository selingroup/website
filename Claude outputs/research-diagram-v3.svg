<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Selin Group research: conceptual diagram</title>
  <desc id="d">Oriented toward sustainability (meeting human needs while protecting health, climate and ecosystems), a cycle links human activities, which release air pollutants such as mercury, PAHs, ozone and fine particulate matter, and greenhouse gases that drive climate change; these pollutants affect people and the planet through health, ecosystem, climate and equity impacts; these impacts inform decisions and policies, which in turn reshape human activities. Systems modeling sits at the center, connecting every stage through a range of tools, from detailed atmospheric chemistry models to fast emulators and integrated human–environment frameworks; it is drawn as a globe echoing the group logo. Pollution and Impacts covers the activities-to-impacts half of the cycle; Decisions and Policies covers the impacts-to-activities half.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6b78"/>
    </marker>
  </defs>
  <rect width="960" height="690" fill="#ffffff"/>

  <!-- sustainability tagline -->
  <text x="480" y="28" text-anchor="middle" font-size="15" fill="#2e7d4f"><tspan font-weight="700" letter-spacing=".6">TOWARD SUSTAINABILITY</tspan><tspan dx="10" fill="#3f6b52">meeting human needs while protecting health, climate and ecosystems</tspan></text>

  <g transform="translate(0,44)">
  <!-- area bands (half-rings) -->
  <path d="M480,72 A260,250 0 0 1 480,572" fill="none" stroke="#d9682b" stroke-opacity=".16" stroke-width="64"/>
  <path d="M480,572 A260,250 0 0 1 480,72" fill="none" stroke="#1d5f8f" stroke-opacity=".14" stroke-width="64"/>
  <text x="930" y="18" text-anchor="end" font-size="17" font-weight="700" fill="#b4521c">POLLUTION AND IMPACTS</text>
  <text x="930" y="38" text-anchor="end" font-size="13" fill="#b4521c">Where pollutants go, and who is affected</text>
  <text x="30" y="608" font-size="17" font-weight="700" fill="#1d5f8f">DECISIONS AND POLICIES</text>
  <text x="30" y="628" font-size="13" fill="#1d5f8f">What actions do, and how they are chosen</text>

  <!-- cycle arrows -->
  <path d="M556,98 A260,250 0 0 1 712,214" fill="none" stroke="#5d6b78" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M736,392 A260,250 0 0 1 572,544" fill="none" stroke="#5d6b78" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M396,548 A260,250 0 0 1 232,420" fill="none" stroke="#5d6b78" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M224,232 A260,250 0 0 1 392,98" fill="none" stroke="#5d6b78" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- spokes from hub -->
  <g stroke="#14324a" stroke-width="1.5" stroke-dasharray="5 5" opacity=".55">
    <line x1="480" y1="206" x2="480" y2="132"/>
    <line x1="596" y1="322" x2="660" y2="322"/>
    <line x1="480" y1="438" x2="480" y2="512"/>
    <line x1="364" y1="322" x2="300" y2="322"/>
  </g>

  <!-- stage nodes -->
  <g font-size="15">
    <rect x="350" y="34" width="260" height="98" rx="14" fill="#fff" stroke="#14324a" stroke-width="1.5"/>
    <text x="480" y="64" text-anchor="middle" font-weight="700" fill="#14324a">Human activities &amp; needs</text>
    <text x="480" y="87" text-anchor="middle" font-size="13" fill="#26313b">energy, food, mobility, industry,</text>
    <text x="480" y="105" text-anchor="middle" font-size="13" fill="#26313b">land use, data centers</text>

    <rect x="660" y="262" width="250" height="120" rx="14" fill="#fff" stroke="#14324a" stroke-width="1.5"/>
    <text x="785" y="292" text-anchor="middle" font-weight="700" fill="#14324a">Pollution &amp; climate change</text>
    <text x="785" y="315" text-anchor="middle" font-size="13" fill="#26313b">mercury, PAHs, ozone, PM₂.₅:</text>
    <text x="785" y="333" text-anchor="middle" font-size="13" fill="#26313b">transport &amp; chemistry;</text>
    <text x="785" y="351" text-anchor="middle" font-size="13" fill="#26313b">CO₂ &amp; climate response</text>

    <rect x="345" y="512" width="270" height="100" rx="14" fill="#fff" stroke="#14324a" stroke-width="1.5"/>
    <text x="480" y="542" text-anchor="middle" font-weight="700" fill="#14324a">Impacts on people &amp; planet</text>
    <text x="480" y="565" text-anchor="middle" font-size="13" fill="#26313b">health, ecosystems, climate risks,</text>
    <text x="480" y="583" text-anchor="middle" font-size="13" fill="#26313b">well-being, equity</text>

    <rect x="50" y="262" width="250" height="120" rx="14" fill="#fff" stroke="#14324a" stroke-width="1.5"/>
    <text x="175" y="292" text-anchor="middle" font-weight="700" fill="#14324a">Decisions &amp; policies</text>
    <text x="175" y="315" text-anchor="middle" font-size="13" fill="#26313b">treaties, regulation,</text>
    <text x="175" y="333" text-anchor="middle" font-size="13" fill="#26313b">organizational action,</text>
    <text x="175" y="351" text-anchor="middle" font-size="13" fill="#26313b">policy evaluation</text>
  </g>

  <!-- hub: globe echoing the group logo -->
  <g>
    <circle cx="480" cy="322" r="116" fill="#14324a"/>
    <g fill="none" stroke="#5f86a6" stroke-opacity=".45" stroke-width="1.5">
      <ellipse cx="480" cy="322" rx="50" ry="116"/>
      <line x1="372" y1="280" x2="588" y2="280"/>
      <line x1="372" y1="364" x2="588" y2="364"/>
      <line x1="480" y1="206" x2="480" y2="438"/>
    </g>
    <circle cx="480" cy="322" r="116" fill="none" stroke="#14324a" stroke-width="3"/>
    <circle cx="563" cy="229" r="17" fill="#d9682b" stroke="#fff" stroke-width="3"/>
  </g>
  <g text-anchor="middle" paint-order="stroke" stroke="#14324a" stroke-width="4" stroke-linejoin="round">
    <text x="480" y="300" font-size="17" font-weight="700" fill="#fff">SYSTEMS MODELING</text>
    <text x="480" y="323" font-size="12.5" fill="#dbe5ee">a range of tools, from</text>
    <text x="480" y="340" font-size="12.5" fill="#dbe5ee">detailed atmospheric models</text>
    <text x="480" y="357" font-size="12.5" fill="#dbe5ee">to fast emulators and</text>
    <text x="480" y="374" font-size="12.5" fill="#dbe5ee">systems frameworks</text>
  </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
