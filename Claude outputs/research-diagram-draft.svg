<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Selin Group research: conceptual diagram</title>
  <desc id="d">A cycle in which human activities and energy systems produce emissions; atmospheric processes transport and transform them; this leads to exposure and impacts on health, ecosystems and climate; these inform decisions and policies, which in turn change human activities. Systems modeling sits at the center, connecting every stage. Pollution and Impacts covers the emissions-to-impacts half of the cycle; Decisions and Policies covers the impacts-to-activities half.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6b78"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>

  <!-- area bands (half-rings) -->
  <path d="M480,72 A260,250 0 0 1 480,572" fill="none" stroke="#d9682b" stroke-opacity=".16" stroke-width="64"/>
  <path d="M480,572 A260,250 0 0 1 480,72" fill="none" stroke="#1d5f8f" stroke-opacity=".14" stroke-width="64"/>
  <text x="940" y="34" text-anchor="end" font-size="17" font-weight="700" fill="#b4521c">POLLUTION AND IMPACTS</text>
  <text x="940" y="54" text-anchor="end" font-size="13" fill="#b4521c">Where pollutants go, and who is affected</text>
  <text x="20" y="606" font-size="17" font-weight="700" fill="#1d5f8f">DECISIONS AND POLICIES</text>
  <text x="20" y="626" font-size="13" fill="#1d5f8f">What actions do, and how they are chosen</text>

  <!-- cycle arrows -->
  <path d="M556,98 A260,250 0 0 1 712,214" fill="none" stroke="#5d6b78" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M736,392 A260,250 0 0 1 572,544" fill="none" stroke="#5d6b78" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M396,548 A260,250 0 0 1 232,420" fill="none" stroke="#5d6b78" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M224,232 A260,250 0 0 1 392,98" fill="none" stroke="#5d6b78" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- spokes from hub -->
  <g stroke="#14324a" stroke-width="1.5" stroke-dasharray="5 5" opacity=".55">
    <line x1="480" y1="250" x2="480" y2="132"/>
    <line x1="560" y1="322" x2="660" y2="322"/>
    <line x1="480" y1="394" x2="480" y2="512"/>
    <line x1="400" y1="322" x2="300" y2="322"/>
  </g>

  <!-- stage nodes -->
  <g font-size="15">
    <rect x="360" y="34" width="240" height="98" rx="14" fill="#fff" stroke="#14324a" stroke-width="1.5"/>
    <text x="480" y="66" text-anchor="middle" font-weight="700" fill="#14324a">Human activities</text>
    <text x="480" y="88" text-anchor="middle" font-size="13" fill="#26313b">energy, transport, industry,</text>
    <text x="480" y="106" text-anchor="middle" font-size="13" fill="#26313b">agriculture, land use, data centers</text>

    <rect x="660" y="262" width="250" height="120" rx="14" fill="#fff" stroke="#14324a" stroke-width="1.5"/>
    <text x="785" y="294" text-anchor="middle" font-weight="700" fill="#14324a">Emissions &amp; atmosphere</text>
    <text x="785" y="316" text-anchor="middle" font-size="13" fill="#26313b">mercury, PAHs, ozone, PM₂.₅,</text>
    <text x="785" y="334" text-anchor="middle" font-size="13" fill="#26313b">greenhouse gases: transport,</text>
    <text x="785" y="352" text-anchor="middle" font-size="13" fill="#26313b">chemistry, climate response</text>

    <rect x="350" y="512" width="260" height="100" rx="14" fill="#fff" stroke="#14324a" stroke-width="1.5"/>
    <text x="480" y="544" text-anchor="middle" font-weight="700" fill="#14324a">Exposure &amp; impacts</text>
    <text x="480" y="566" text-anchor="middle" font-size="13" fill="#26313b">human health, ecosystems,</text>
    <text x="480" y="584" text-anchor="middle" font-size="13" fill="#26313b">climate risks, equity</text>

    <rect x="50" y="262" width="250" height="120" rx="14" fill="#fff" stroke="#14324a" stroke-width="1.5"/>
    <text x="175" y="294" text-anchor="middle" font-weight="700" fill="#14324a">Decisions &amp; policies</text>
    <text x="175" y="316" text-anchor="middle" font-size="13" fill="#26313b">treaties, regulation,</text>
    <text x="175" y="334" text-anchor="middle" font-size="13" fill="#26313b">organizational actions,</text>
    <text x="175" y="352" text-anchor="middle" font-size="13" fill="#26313b">policy evaluation</text>
  </g>

  <!-- hub -->
  <ellipse cx="480" cy="322" rx="118" ry="86" fill="#14324a"/>
  <text x="480" y="300" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">SYSTEMS MODELING</text>
  <text x="480" y="324" text-anchor="middle" font-size="12.5" fill="#dbe5ee">chemical transport &amp;</text>
  <text x="480" y="341" text-anchor="middle" font-size="12.5" fill="#dbe5ee">Earth system models,</text>
  <text x="480" y="358" text-anchor="middle" font-size="12.5" fill="#dbe5ee">AI emulators, systems frameworks</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
