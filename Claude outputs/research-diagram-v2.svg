<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Selin Group research: conceptual diagram</title>
  <desc id="d">Framed by the goal of sustainability (meeting human needs while protecting health, climate and ecosystems), a cycle links human activities, which release pollutants including mercury, PAHs, ozone, fine particulate matter, carbon dioxide and other greenhouse gases; these pollutants affect people and the planet through health, ecosystem, climate and equity impacts; these impacts inform decisions and policies, which in turn reshape human activities. Systems modeling sits at the center, connecting every stage through fast emulators of complex chemistry and climate models and integrated human–environment frameworks. Pollution and Impacts covers the activities-to-impacts half of the cycle; Decisions and Policies covers the impacts-to-activities half.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6b78"/>
    </marker>
  </defs>
  <rect width="960" height="710" fill="#ffffff"/>

  <!-- sustainability frame -->
  <rect x="8" y="46" width="944" height="656" rx="26" fill="#2e7d4f" fill-opacity=".05" stroke="#2e7d4f" stroke-width="2.5"/>
  <text x="480" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#24683f" letter-spacing=".5">SUSTAINABILITY</text>
  <text x="480" y="42" text-anchor="middle" font-size="13" fill="#24683f">meeting human needs while protecting health, climate and ecosystems</text>

  <g transform="translate(0,56)">
  <!-- area bands (half-rings) -->
  <path d="M480,72 A260,250 0 0 1 480,572" fill="none" stroke="#d9682b" stroke-opacity=".16" stroke-width="64"/>
  <path d="M480,572 A260,250 0 0 1 480,72" fill="none" stroke="#1d5f8f" stroke-opacity=".14" stroke-width="64"/>
  <text x="930" y="18" text-anchor="end" font-size="17" font-weight="700" fill="#b4521c">POLLUTION AND IMPACTS</text>
  <text x="930" y="38" text-anchor="end" font-size="13" fill="#b4521c">Where pollutants go, and who is affected</text>
  <text x="30" y="608" font-size="17" font-weight="700" fill="#1d5f8f">DECISIONS AND POLICIES</text>
  <text x="30" y="628" font-size="13" fill="#1d5f8f">What actions do, and how they are chosen</text>

  <!-- cycle arrows -->
  <path d="M556,98 A260,250 0 0 1 712,214" fill="none" stroke="#5d6b78" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M736,392 A260,250 0 0 1 572,544" fill="none" stroke="#5d6b78" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M396,548 A260,250 0 0 1 232,420" fill="none" stroke="#5d6b78" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M224,232 A260,250 0 0 1 392,98" fill="none" stroke="#5d6b78" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- spokes from hub -->
  <g stroke="#14324a" stroke-width="1.5" stroke-dasharray="5 5" opacity=".55">
    <line x1="480" y1="236" x2="480" y2="132"/>
    <line x1="580" y1="322" x2="660" y2="322"/>
    <line x1="480" y1="408" x2="480" y2="512"/>
    <line x1="380" y1="322" x2="300" y2="322"/>
  </g>

  <!-- stage nodes -->
  <g font-size="15">
    <rect x="350" y="34" width="260" height="98" rx="14" fill="#fff" stroke="#14324a" stroke-width="1.5"/>
    <text x="480" y="64" text-anchor="middle" font-weight="700" fill="#14324a">Human activities &amp; needs</text>
    <text x="480" y="87" text-anchor="middle" font-size="13" fill="#26313b">energy, food, mobility, industry,</text>
    <text x="480" y="105" text-anchor="middle" font-size="13" fill="#26313b">land use, data centers</text>

    <rect x="660" y="262" width="250" height="120" rx="14" fill="#fff" stroke="#14324a" stroke-width="1.5"/>
    <text x="785" y="292" text-anchor="middle" font-weight="700" fill="#14324a">Pollutants in the environment</text>
    <text x="785" y="315" text-anchor="middle" font-size="13" fill="#26313b">mercury, PAHs, ozone, PM₂.₅,</text>
    <text x="785" y="333" text-anchor="middle" font-size="13" fill="#26313b">CO₂ &amp; other greenhouse gases:</text>
    <text x="785" y="351" text-anchor="middle" font-size="13" fill="#26313b">transport, chemistry, climate</text>

    <rect x="345" y="512" width="270" height="100" rx="14" fill="#fff" stroke="#14324a" stroke-width="1.5"/>
    <text x="480" y="542" text-anchor="middle" font-weight="700" fill="#14324a">Impacts on people &amp; planet</text>
    <text x="480" y="565" text-anchor="middle" font-size="13" fill="#26313b">health, ecosystems, climate risks,</text>
    <text x="480" y="583" text-anchor="middle" font-size="13" fill="#26313b">well-being, equity</text>

    <rect x="50" y="262" width="250" height="120" rx="14" fill="#fff" stroke="#14324a" stroke-width="1.5"/>
    <text x="175" y="292" text-anchor="middle" font-weight="700" fill="#14324a">Decisions &amp; policies</text>
    <text x="175" y="315" text-anchor="middle" font-size="13" fill="#26313b">treaties, regulation,</text>
    <text x="175" y="333" text-anchor="middle" font-size="13" fill="#26313b">organizational action,</text>
    <text x="175" y="351" text-anchor="middle" font-size="13" fill="#26313b">policy evaluation</text>
  </g>

  <!-- hub -->
  <ellipse cx="480" cy="322" rx="132" ry="90" fill="#14324a"/>
  <text x="480" y="294" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">SYSTEMS MODELING</text>
  <text x="480" y="318" text-anchor="middle" font-size="12.5" fill="#dbe5ee">fast emulators of complex</text>
  <text x="480" y="335" text-anchor="middle" font-size="12.5" fill="#dbe5ee">chemistry &amp; climate models;</text>
  <text x="480" y="352" text-anchor="middle" font-size="12.5" fill="#dbe5ee">integrated human–environment</text>
  <text x="480" y="369" text-anchor="middle" font-size="12.5" fill="#dbe5ee">frameworks</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
